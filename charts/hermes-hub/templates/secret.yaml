{{- if .Values.adminToken.create }}
{{- if not .Values.adminToken.value }}
{{- fail "adminToken.value is required when adminToken.create=true; prefer an existing Secret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-hub.fullname" . }}-admin
  labels:
    {{- include "hermes-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.adminToken.key }}: {{ .Values.adminToken.value | quote }}
{{- end }}
