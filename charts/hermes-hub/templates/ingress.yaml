{{- if .Values.tailscale.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hermes-hub.fullname" . }}
  labels:
    {{- include "hermes-hub.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.tailscale.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.tailscale.tags }}
    tailscale.com/tags: {{ .Values.tailscale.tags | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.tailscale.ingressClassName }}
  rules:
    - host: {{ .Values.tailscale.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hermes-hub.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.tailscale.hostname }}
{{- end }}
