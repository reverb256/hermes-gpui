[workspace]
resolver = "2"
members = [
    "crates/hermes-rpc",
    "crates/hermes-api",
    "crates/hermes-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/reverb256/hermes-gpui"

[workspace.dependencies]
hermes-rpc = { path = "crates/hermes-rpc" }
hermes-api = { path = "crates/hermes-api" }

anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
