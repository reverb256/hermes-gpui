apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-hub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/reverb256/hermes-gpui.git
    targetRevision: main
    path: charts/hermes-hub
    helm:
      releaseName: hermes-hub
      valueFiles:
        - values.yaml
      valuesObject:
        image:
          repository: registry.registry.svc.cluster.local:5000/hermes/hub
          digest: sha256:528eb492d55e221efac551fa6efe558406721ee712e9305c1023c06ed687f5e7
          pullPolicy: IfNotPresent
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
