apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-hub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/reverb256/hermes-gpui.git
    targetRevision: main
    path: charts/hermes-hub
    helm:
      releaseName: hermes-hub
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
